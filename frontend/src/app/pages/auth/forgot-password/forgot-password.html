<div class="auth-page">
  <form class="auth-card" (submit)="onSubmit($event)" novalidate>
    <div class="auth-icon"><svg lucideIcon="key-round" size="24"></svg></div>
    <h1>Forgot password?</h1>
    <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

    @if (successMessage()) {
      <div class="alert alert-success">
        <svg lucideIcon="circle-check" size="18"></svg>
        <span>{{ successMessage() }}</span>
      </div>
    }
    @if (errorMessage()) {
      <div class="alert alert-error">
        <svg lucideIcon="circle-alert" size="18"></svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <app-input-field
      label="Email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      icon="mail"
      [field]="form.email"
    />

    <button class="btn btn-primary" type="submit" [disabled]="form().submitting()">
      @if (form().submitting()) {
        <svg lucideIcon="loader-circle" class="spin" size="18"></svg>
      } @else {
        <svg lucideIcon="send" size="18"></svg>
      }
      {{ form().submitting() ? 'Sending...' : 'Send reset link' }}
    </button>

    <p class="footer-text">
      <a class="back-link" routerLink="/login"
        ><svg lucideIcon="arrow-left" size="16"></svg> Back to login</a
      >
    </p>
  </form>
</div>
