<div class="auth-page">
  <form class="auth-card" (submit)="onSubmit($event)" novalidate>
    <div class="auth-icon"><lucide-icon name="key-round" [size]="24"></lucide-icon></div>
    <h1>Forgot password?</h1>
    <p class="subtitle">Enter your email and we'll send you a link to reset your password.</p>

    @if (successMessage()) {
      <div class="alert alert-success">
        <lucide-icon name="circle-check" [size]="18"></lucide-icon>
        <span>{{ successMessage() }}</span>
      </div>
    }
    @if (errorMessage()) {
      <div class="alert alert-error">
        <lucide-icon name="circle-alert" [size]="18"></lucide-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <app-input-field
      label="Email"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      icon="mail"
      [field]="form.email"
    />

    <button class="btn btn-primary" type="submit" [disabled]="form().submitting()">
      @if (form().submitting()) {
        <lucide-icon name="loader-circle" class="spin" [size]="18"></lucide-icon>
      } @else {
        <lucide-icon name="send" [size]="18"></lucide-icon>
      }
      {{ form().submitting() ? 'Sending...' : 'Send reset link' }}
    </button>

    <p class="footer-text">
      <a class="back-link" routerLink="/login"
        ><lucide-icon name="arrow-left" [size]="16"></lucide-icon> Back to login</a
      >
    </p>
  </form>
</div>
