<div class="auth-page">
  <form class="auth-card" (submit)="onSubmit($event)" novalidate>
    <div class="auth-icon"><svg lucideIcon="shield-check" size="24"></svg></div>
    <h1>Reset password</h1>

    @if (successMessage()) {
      <div class="alert alert-success">
        <svg lucideIcon="circle-check" size="18"></svg>
        <span>{{ successMessage() }}</span>
      </div>
      <a class="btn btn-primary" routerLink="/login">
        <svg lucideIcon="log-in" size="18"></svg>
        Go to login
      </a>
    } @else {
      <p class="subtitle">Choose a new password for your account.</p>

      @if (errorMessage()) {
        <div class="alert alert-error">
          <svg lucideIcon="circle-alert" size="18"></svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <app-input-field
        label="New password"
        type="password"
        placeholder="At least 6 characters"
        autocomplete="new-password"
        icon="lock"
        [field]="form.password"
      />

      <app-input-field
        label="Confirm password"
        type="password"
        placeholder="Re-enter your new password"
        autocomplete="new-password"
        icon="lock"
        [field]="form.confirmPassword"
      />

      <button class="btn btn-primary" type="submit" [disabled]="form().submitting()">
        @if (form().submitting()) {
          <svg lucideIcon="loader-circle" class="spin" size="18"></svg>
        } @else {
          <svg lucideIcon="shield-check" size="18"></svg>
        }
        {{ form().submitting() ? 'Resetting...' : 'Reset password' }}
      </button>

      <p class="footer-text">
        Link expired? <a routerLink="/forgot-password">Request a new one</a>
      </p>
    }
  </form>
</div>
