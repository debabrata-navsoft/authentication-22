<div class="dashboard">
  <header class="topbar">
    <span class="brand"><lucide-icon name="shield-check" [size]="22"></lucide-icon> Auth App</span>
    <button class="btn btn-outline" type="button" (click)="logout()">
      <lucide-icon name="log-out" [size]="18"></lucide-icon>
      Log out
    </button>
  </header>

  <main class="content">
    @if (user(); as user) {
      <h1>Hello, {{ user.name }} 👋</h1>
      <p class="subtitle">You are logged in.</p>

      <div class="profile-card">
        <div class="row">
          <span class="key"><lucide-icon name="user" [size]="18"></lucide-icon> Name</span>
          <span>{{ user.name }}</span>
        </div>
        <div class="row">
          <span class="key"><lucide-icon name="mail" [size]="18"></lucide-icon> Email</span>
          <span>{{ user.email }}</span>
        </div>
        <div class="row">
          <span class="key"><lucide-icon name="phone" [size]="18"></lucide-icon> Phone</span>
          <span>{{ user.phone }}</span>
        </div>
        <div class="row">
          <span class="key"><lucide-icon name="calendar" [size]="18"></lucide-icon> Member since</span>
          <span>{{ user.createdAt | date: 'mediumDate' }}</span>
        </div>
      </div>
    } @else {
      <p>Loading...</p>
    }
  </main>
</div>
