<div class="dashboard">
  <header class="topbar">
    <span class="brand"><svg lucideIcon="shield-check" size="22"></svg> Auth App</span>
    <button class="btn btn-outline" type="button" (click)="logout()">
      <svg lucideIcon="log-out" size="18"></svg>
      Log out
    </button>
  </header>

  <main class="content">
    @if (user(); as user) {
      <h1>Hello, {{ user.name }} 👋</h1>
      <p class="subtitle">You are logged in.</p>

      <div class="profile-card">
        <div class="row">
          <span class="key"><svg lucideIcon="user" size="18"></svg> Name</span>
          <span>{{ user.name }}</span>
        </div>
        <div class="row">
          <span class="key"><svg lucideIcon="mail" size="18"></svg> Email</span>
          <span>{{ user.email }}</span>
        </div>
        <div class="row">
          <span class="key"><svg lucideIcon="phone" size="18"></svg> Phone</span>
          <span>{{ user.phone }}</span>
        </div>
        <div class="row">
          <span class="key"><svg lucideIcon="calendar" size="18"></svg> Member since</span>
          <span>{{ user.createdAt | date: 'mediumDate' }}</span>
        </div>
      </div>
    } @else {
      <p>Loading...</p>
    }
  </main>
</div>
