<div class="field">
  <label [for]="id">{{ label() }}</label>

  <div class="input-wrapper" [class.has-icon]="icon()">
    @if (icon(); as icon) {
      <lucide-icon class="leading-icon" [name]="icon" [size]="18"></lucide-icon>
    }

    <input
      [id]="id"
      [type]="inputType()"
      [formField]="field()"
      [placeholder]="placeholder()"
      [attr.autocomplete]="autocomplete()"
      [class.invalid]="errorMessage()"
    />

    @if (type() === 'password') {
      <button
        type="button"
        class="toggle"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      >
        @if (showPassword()) {
          <lucide-icon name="eye-off" [size]="18"></lucide-icon>
        } @else {
          <lucide-icon name="eye" [size]="18"></lucide-icon>
        }
      </button>
    }
  </div>

  @if (errorMessage()) {
    <small class="error">
      <lucide-icon name="circle-alert" [size]="14"></lucide-icon>
      {{ errorMessage() }}
    </small>
  }
</div>
